plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

int betaVer = 0

// ── 可选私有功能源码（不入库）──────────────────────────────────────────────
// 私有功能的源码/资源/清单放在仓库根目录的 private/ 下，已被 .gitignore 排除，永不进公开仓库。
// 公共仓库里的挂点只有 util/OptionalFeatures（反射门面）和几处条件注册，不含任何实现。
//   private/src/main/java/...  → 并进主源集
//   private/res/...            → 并进资源
//   private/manifest/…         → 并进合并清单（CAMERA 权限、两个 Activity 都在这里声明）
//   private/keep.pro           → release 的 R8 保留规则（私有类只被反射引用，必须 keep）
// 目录不存在时（公开 CI、PR 构建、其他开发者）以上全部跳过，工程照常编过、功能不存在。
def privateFeatureRoot = project.rootProject.file('private')
def hasPrivateFeature = new File(privateFeatureRoot, 'src/main/java').exists()

android {

    namespace 'com.RobinNotBad.BiliClient'
    compileSdk 34

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
            if (hasPrivateFeature) {
                java.srcDirs += new File(privateFeatureRoot, 'src/main/java')
                res.srcDirs += new File(privateFeatureRoot, 'res')
            }
        }
        // 私有功能的纯 JVM 单测跟私有源码一起注入；没有 private/ 时这个目录不存在，
        // 源集为空，公开构建不受影响（对应私有仓库的 private/src/test/java）。
        test {
            if (hasPrivateFeature) {
                java.srcDirs += new File(privateFeatureRoot, 'src/test/java')
            }
        }
    }

    defaultConfig {
        applicationId "com.RobinNotBad.BiliClient"
        minSdk 19
        targetSdk 34
        versionCode 2610311
        versionName "26.10.31"

        if (betaVer) {
            versionName += "-BETA" + betaVer
        }

        multiDexEnabled true

        resConfigs 'zh'

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists()) {
                Properties pro = new Properties()
                pro.load(localProps.newDataInputStream())
                if (pro.containsKey("KEY_PATH")) {
                    storeFile project.rootProject.file(pro.getProperty("KEY_PATH", "key.jks"))
                    storePassword pro.getProperty("KEY_PASSWORD")
                    keyAlias pro.getProperty("ALIAS_NAME")
                    keyPassword pro.getProperty("ALIAS_PASSWORD")
                }
            }
        }
    }

    // 两个发行渠道（26.10.11 新增共存版）：
    //   standard —— 包名不变，覆盖升级既有用户；
    //   coexist  —— 包名加 .coexist 后缀，可与普通版**同时安装**（MT 管理器那种共存版）。
    // 两者只有**包名与图标**不同，代码与资源其余部分共用；数据（登录态、设置、缓存、
    // /Android/media/<包名>/）按包名天然隔离，所以共存版要重新登录一次。
    // 名称**刻意保持一致**（两版都叫「RE:哔哩终端」，`app_name` 一个键管应用名与桌面名）——
    // 用户 26.10.11 明确要求，靠图标区分（共存版用上游原图标，见 app/src/coexist/res/mipmap-nodpi/）。
    // 注意：加了 flavor 后单测任务名变成 testStandardDebugUnitTest / testCoexistDebugUnitTest，
    // 老的 testDebugUnitTest 不再存在（CI 与 AGENTS.md 已同步）。见 docs/architecture-map.md §7.37。
    flavorDimensions += 'channel'
    productFlavors {
        standard {
            dimension 'channel'
            buildConfigField "boolean", "COEXIST", "false"
        }
        coexist {
            dimension 'channel'
            applicationIdSuffix ".coexist"
            buildConfigField "boolean", "COEXIST", "true"
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            buildConfigField "boolean", "LOG_DEBUG", "false"
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasPrivateFeature) {
                proguardFile new File(privateFeatureRoot, 'keep.pro')
            }
            def localProps = project.rootProject.file("local.properties")
            if (localProps.exists()) {
                Properties pro = new Properties()
                pro.load(localProps.newDataInputStream())
                if (pro.containsKey("KEY_PATH")) {
                    signingConfig signingConfigs.release
                }
            }

            zipAlignEnabled true
            crunchPngs false
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false

            zipAlignEnabled true
            crunchPngs false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                '-opt-in=kotlin.RequiresOptIn',
                '-Xinline-classes',
                '-Xjvm-default=all'
        ]
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/*.kotlin_module'
            excludes += '/META-INF/*.version'
            excludes += '/kotlin/**'
            excludes += '/DebugProbesKt.bin'
            excludes += '/okhttp3/internal/publicsuffix/*'
            excludes += '/META-INF/maven/**'
            excludes += '/META-INF/proguard/**'
            excludes += '/META-INF/*.kotlin_builtins'
        }
    }

    buildFeatures {
        viewBinding false
        buildConfig true
        compose false
        dataBinding false
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'UnusedResources', 'UnusedIds', 'MissingTranslation', 'ExtraTranslation'
    }

    bundle {
        language {
            enableSplit true
        }
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
    }

    // APK 按架构独立打包（仅 assembleRelease 时生效），并额外生成包含所有架构的通用包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86'
            universalApk true
        }
    }
}

// 私有清单（CAMERA 权限 + 两个 Activity）用 variant 的清单源目录并进合并清单。
// 这是 AGP 8 的标准入口：等价于给每个变体多挂一个 src/<buildType>/AndroidManifest.xml。
androidComponents {
    onVariants(selector().all()) { variant ->
        if (hasPrivateFeature) {
            variant.sources.manifests?.addStaticManifestFile(
                    new File(privateFeatureRoot, 'manifest/AndroidManifest.xml').absolutePath)
        }
    }
}

// 桌面路径：真实桌面可能不在 user.home（如用户目录被重定向到其他盘），按候选路径取第一个存在的
def desktopCandidates = [
        "${System.getenv('USERPROFILE')}\\Desktop",
        "${System.getProperty('user.home')}\\Desktop",
        "${System.getProperty('user.dir')}\\.."
]
def desktopPath = desktopCandidates.find { new File(it).exists() } ?: "${System.getProperty('user.home')}\\Desktop"
def apkOutputPath = "${projectDir}/build/outputs/apk/release"

task copyApkToDesktop {
    dependsOn 'assembleRelease'
    
    doLast {
        def desktopDir = new File(desktopPath)
        def apkDir = new File(apkOutputPath)
        
        if (!apkDir.exists()) {
            println "APK directory not found: ${apkDir.absolutePath}"
            return
        }
        
        apkDir.eachFileMatch(~/.*\.apk/) { apkFile ->
            def destFile = new File(desktopDir, apkFile.name)
            
            if (destFile.exists()) {
                println "Removing old APK: ${destFile.absolutePath}"
                destFile.delete()
            }
            
            println "Copying APK to desktop: ${apkFile.name}"
            destFile.withOutputStream { os ->
                apkFile.withInputStream { is ->
                    os << is
                }
            }
            
            println "APK copied successfully to: ${destFile.absolutePath}"
            
            println "Installing APK via ADB..."
            def adbCmd = "adb install -r ${destFile.absolutePath}"
            println "Executing: $adbCmd"
            def process = adbCmd.execute()
            process.in.eachLine { line -> println "ADB output: $line" }
            process.err.eachLine { line -> println "ADB error: $line" }
            process.waitFor()
            
            if (process.exitValue() == 0) {
                println "APK installed successfully!"
            } else {
                println "ADB install failed with exit code: ${process.exitValue()}"
            }
        }
    }
}

// 复制/安装 APK 是可选后处理：不阻塞 assembleRelease，需要时手动执行 gradlew copyApkToDesktop
// afterEvaluate {
//     assembleRelease.finalizedBy copyApkToDesktop
// }

dependencies {
    // Kotlin
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Hilt DI 已移除：BiliTerminalApp 从未被实例化，Manifest 的 Application 是 BiliTerminal，
    // Hilt 生成的组件在运行期完全用不到；ksp/serialization 插件也仅服务于这些死依赖。

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // UI
    // minSdk 19 的硬约束：appcompat 1.7.0 / fragment-ktx 1.8.0 的 AAR 自身 minSdkVersion 是 21，
    // 清单合并会直接失败。1.6.1 / 1.6.2 是仍声明 minSdk 14 的最后一代，故钉在这里。
    // 想升回 1.7.0 / 1.8.0 必须先把 minSdk 提回 21。依据见 docs/architecture-map.md §1.1。
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    // Glide annotation processor
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Existing essential deps
    implementation 'com.google.zxing:core:3.5.3'
    // jsoup 钉死在 1.16.1：1.16.2 起其 StringUtil 的 <clinit> 会碰 API 24 才有的
    // ThreadLocal.withInitial，minSdk 21 上解析 HTML 会 NoSuchMethodError。原因与验证见
    // docs/architecture-map.md §1.1「依赖里的 API 24 引用」。别再往上升。
    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.3.1'

    // Player & Danmaku
    implementation project(path: ':ijkplayer-java')
    implementation project(path: ':DanmakuFlameMaster')
    implementation project(path: ':brotlij')

    // minSdk 19（< 21）时 ART 还不支持原生多 dex，必须靠 multidex 库 + Application.attachBaseContext
    // 里的 MultiDex.install()（见 BiliTerminal.kt）。AGP 只会自动带上 2.0.0，这里显式钉 2.0.1。
    // 若日后 minSdk 提回 21，这一条和 BiliTerminal 里的 install() 都要一起删掉。
    implementation 'androidx.multidex:multidex:2.0.1'
    // 注：androidx.asynclayoutinflater、protobuf-javalite、geetest sensebot 全工程零引用，已移除

    // UETool (饿了么开源) UI 调试工具，仅 Debug 生效，release 用 no-op 空实现
    debugImplementation 'com.github.eleme.UETool:uetool:1.3.4'
    debugImplementation 'com.github.eleme.UETool:uetool-base:1.3.4'
    releaseImplementation 'com.github.eleme.UETool:uetool-no-op:1.3.4'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}

// ---------------------------------------------------------------------------
// 版本号一致性校验（见 docs/archive/review/upstream-fork-audit.md §五 E1）
//
// versionName / versionCode 分散在多处，全靠人工同步，历史上已实际漂移过两次
//（readme badge 停在 26.09.07、docs/FEATURES.md 停在 26.08.14）：
//   1. 本文件 defaultConfig —— 唯一真正决定安装包版本的地方
//   2. app/src/main/res/values/strings.xml 的更新日志锚点「【<versionName> 本次更新】」—— 用户可见
//
// 注：更新检查已改为直接读 Gitee / GitHub 的发行版（见 util/UpdateManager.kt 与
// 发版工作流 .github/workflows/build-release.yml），版本号由发版工作流从本文件读出来、
// 写进 Release 说明的机器可读元数据里，因此不再有需要单独部署并人工同步的 config.json。
//
// 刻意不挂在 assemble 上：本地改完 build.gradle、还没同步文档时不该连编译都被挡住。
// 挂在 check 上，并由 CI 显式调用一次以便尽早失败。
tasks.register('verifyVersionConsistency') {
    group = 'verification'
    description = '校验 build.gradle 与 strings.xml 两处版本号是否一致'

    def expectName = android.defaultConfig.versionName
    def expectCode = android.defaultConfig.versionCode
    def stringsFile = file('src/main/res/values/strings.xml')

    // 显式声明输入，保证配置缓存命中时不会拿旧值
    inputs.property('versionName', expectName)
    inputs.property('versionCode', expectCode)
    inputs.file(stringsFile)

    doLast {
        def problems = []
        def anchor = "【${expectName} 本次更新】"

        // 2) 更新日志锚点：关于页的「本次更新」标题必须跟着版本号走
        if (!stringsFile.getText('UTF-8').contains(anchor)) {
            problems << "src/main/res/values/strings.xml 里找不到更新日志锚点「${anchor}」，请把当版更新说明的标题改成该字符串"
        }

        if (!problems.isEmpty()) {
            throw new GradleException('版本号不一致：\n  - ' + problems.join('\n  - '))
        }
        logger.lifecycle("verifyVersionConsistency：版本号一致 versionName=${expectName} versionCode=${expectCode}")
    }
}

// 让 ./gradlew check 带上这项校验（check 由 Android 基础插件提供，这里用 matching 避免强依赖）
tasks.matching { it.name == 'check' }.configureEach { dependsOn 'verifyVersionConsistency' }