name: CI 编译与单测自检

# 触发方式：
# 1) 向 main 提 PR：编译 + 单测自检（此前任何 PR 都不会被编译，见 docs/review/upstream-fork-audit.md §五 E3）
# 2) push 到 main：同上，防止直接推 main 引入编译不过的提交
# 3) 手工触发（workflow_dispatch）
#
# 发版流程（tag -> Release）在 build-release.yml，与本文件互不重叠：本文件不监听 tag。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的旧运行没有价值，直接取消，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 不能省：sdkmanager 的旧 "tools" 包已被 Google 从 SDK 仓库下架，
          # 而本 action 的默认 packages 是 "tools platform-tools"，
          # 于是 sdkmanager 会以 `Warning: Failed to find package 'tools'` + exit 1 直接打死整个 job
          # （2026-10-02 run 36973006267 就是这样失败的，见 job 日志第 971~992 行）。
          # 只装 platform-tools：编译要的 platform / build-tools 由 AGP 在授权后按需自动下载
          # （上一步 sdkmanager --licenses 已全部接受）。
          packages: 'platform-tools'

      - name: 赋予 gradlew 可执行权限
        run: chmod +x gradlew

      # wrapper 发行版有 138 MB，而 services.gradle.org 只回 307，实体落在
      # GitHub Release 资产上（release-assets.githubusercontent.com）。2026-11-08
      # 那台 runner 读该资产稳定 read timeout，同一个 job 连挂 5 次（run 42468546938），
      # 每次都是「Downloading … failed: timeout」，卡在第一步就红。
      # 每个 CI 都现下 138 MB 本来就是纯浪费：缓存起来，命中后 ./gradlew 直接用现成发行版。
      - name: 缓存 Gradle 发行版与依赖缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 缓存未命中时仍要真下 138 MB，一次卡顿就整轮红。这里先单独把发行版拉下来，
      # 失败退避重试 3 次；真正的编译/单测步骤再失败就是代码问题，不含下载噪音。
      - name: 预热 Gradle 发行版（失败重试）
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-configuration-cache; then
              echo "Gradle 发行版就绪（第 $attempt 次尝试）"
              exit 0
            fi
            echo "::warning::第 $attempt 次下载/启动 Gradle 失败，$((attempt * 15)) 秒后重试"
            sleep $((attempt * 15))
          done
          echo "::error::Gradle 发行版连续 3 次下载失败（services.gradle.org 重定向到 GitHub Release 资产），先确认 runner 网络再重跑"
          exit 1

      # 与 build-release.yml 保持同一套清理逻辑：
      # gradle.properties 硬编码了本机 Windows JDK 路径与本地代理（Clash），
      # Linux CI 必须移除，否则会拿不存在的 JDK 路径启动 daemon、并通过本地代理拉依赖失败。
      # 同时把 Gradle/Kotlin daemon 堆内存调低，避免在 GitHub 较小内存的 runner 上 OOM。
      - name: 适配 Linux 构建环境
        run: |
          # 注释形式的本机配置同样要删：本仓库 gradle.properties 里的代理就是
          # `#systemProp.http.proxyHost=127.0.0.1` 这种注释行，原正则只匹配行首的
          # `systemProp.`，删不掉它们；而下面的守卫 grep 又会命中注释行，
          # 于是这步在改任何代码之前就自我判失败（2026-10-02 run 36973234644）。
          sed -i -E '/^[[:space:]]*#?[[:space:]]*org\.gradle\.java\.home=/d' gradle.properties
          sed -i -E '/^[[:space:]]*#?[[:space:]]*systemProp\.(http|https)\.(proxyHost|proxyPort)=/d' gradle.properties
          # 堆内存必须整行替换：原先写死 `-Xmx4096m`，而本仓库实际是 `-Xmx8192m`，
          # 替换 0 命中、后面又挂了 `|| true`，于是「防 runner OOM」从未生效（调研清单第 3 条）。
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -Xms1024m -Dfile.encoding=UTF-8/' gradle.properties
          sed -i -E 's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2048m/' gradle.properties
          # 替换成功与否必须硬校验：否则下次 gradle.properties 再改一次值，这里又会静默空转。
          if ! grep -qE '^org\.gradle\.jvmargs=-Xmx2048m' gradle.properties; then
            echo "::error::org.gradle.jvmargs 未被替换成 -Xmx2048m，Gradle daemon 堆内存设置没生效"
            exit 1
          fi
          echo "CI 实际生效的 JVM 参数："
          grep -nE '^(org\.gradle\.jvmargs|kotlin\.daemon\.jvmargs)=' gradle.properties
          # 守卫只针对“生效行”：注释行不影响 Gradle 行为，不该让 CI 红。
          if grep -nE '^[[:space:]]*(org\.gradle\.java\.home|systemProp\.(http|https)\.(proxyHost|proxyPort))=' gradle.properties; then
            echo "::error::gradle.properties 仍残留生效中的本机配置，请检查"
            exit 1
          fi
          echo "gradle.properties 已清理"

      # 版本号分散在 build.gradle / strings.xml 两处靠人工同步，
      # 历史上已实际漂移过（readme badge、docs/FEATURES.md）。见审计 §五 E1。
      # （原先第三处 config.json 已随「更新检查改读发行版」一并取消，见 build-release.yml）
      - name: 校验版本号一致性
        run: ./gradlew :app:verifyVersionConsistency --no-configuration-cache

      # 显式关掉配置缓存：CI 只跑一次构建，缓存收益为负，而且配置缓存会把
      # 上一次构建的输入快照写进 build/ 目录，出问题时排查成本高于收益。
      - name: 编译 Debug 包
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      # 112 个单测此前不在任何自动化路径执行，测试全红也能发版（见 §五 E3）
      # 引入 product flavor 后任务名带 flavor：testDebugUnitTest 已不存在。
      # 两个 flavor 共用同一份 app/src/test，但构建配置不同（applicationId / 清单 / 资源），
      # 所以两个都要跑：coexist 此前从未进过任何 CI（调研清单第 6 条）。
      - name: 运行单元测试（standard flavor）
        run: ./gradlew :app:testStandardDebugUnitTest --no-configuration-cache --stacktrace

      - name: 运行单元测试（coexist flavor）
        run: ./gradlew :app:testCoexistDebugUnitTest --no-configuration-cache --stacktrace

      # R8 / shrinkResources / proguard / private keep.pro 这条链路此前只在打 tag 发版时
      # 第一次被验证，keep 漏一条就是运行期崩溃，而那是发现代价最高的时刻（调研清单第 6 条）。
      # 这里用 unsigned release 包做冒烟：CI 不写签名材料，没有签名配置时 AGP 产出 unsigned APK 是正常的。
      - name: 编译 Release 包（R8 冒烟）
        run: ./gradlew :app:assembleRelease --no-configuration-cache --stacktrace

      # 单测失败时也要把报告传上来，否则只能看到一行 FAILED
      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          # flavor 化后产物在 outputs/apk/<flavor>/debug/ 下（standard/coexist 各一份），
          # 旧的 outputs/apk/debug/ 路径已不存在，if-no-files-found: error 会让每次 CI 必红。
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
