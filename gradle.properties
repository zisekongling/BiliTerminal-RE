# Project-wide Gradle settings optimized for high-performance machines
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 需要 JDK 17（AGP 8.x 的硬要求）。这里**刻意不写死机器路径**：写死过一次
# C:\Program Files\Java\jdk-17，换台机器或换 JDK 发行版就变成
# "Value '...' given for org.gradle.java.home Gradle property is invalid"，整个构建起不来。
# 本机 JAVA_HOME 不是 17 时，在**用户级** ~/.gradle/gradle.properties 里设：
#   org.gradle.java.home=C:/path/to/jdk-17
# 或直接让 JAVA_HOME 指向 JDK 17（CI 用 actions/setup-java 17 即是后者）。

# JVM 配置按「通用开发机」取值，不按顶配工作站：这个文件对仓库里每台机器都生效，
# 写 8 G 堆只有 16 G 以上的机器吃得下，小机器会直接 OOM。
# 2026-11-10 实测：2 核 / 7941 MiB 的服务器上照这份配置构建，Gradle daemon 被内核
# OOM killer 杀掉（java total-vm 11.7 G、anon-rss 2.85 G），连宿主的 dsh-web 一起拖死。
# -Xmx：4 G 足够本仓库（AGP 8 + R8）的常规构建；更小的机器别改这里，用本机
#   ~/.gradle/gradle.properties 或 `./gradlew -Dorg.gradle.jvmargs=-Xmx1500m` 覆盖。
# -Xms：初始堆，别追平 -Xmx —— 小内存机器上是白占。
# -XX:+UseG1GC：低停顿 GC；-XX:MaxGCPauseMillis：GC 停顿目标；
# -XX:+ParallelRefProcEnabled：并行引用处理；-XX:+UseStringDeduplication：字符串去重。
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -XX:+OptimizeStringConcat -Dfile.encoding=UTF-8

# Enable parallel project execution for multi-module builds
org.gradle.parallel=true

# Enable build cache for faster incremental builds
org.gradle.caching=true

# Enable configuration cache (significantly speeds up repeated builds)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.max-problems=50
org.gradle.configuration-cache.problems=warn

# Enable incremental compilation for Java
org.gradle.java.compile.incremental=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# 将旧版 support library 依赖迁移为 AndroidX 等价物，避免 debug 构建出现重复类冲突
android.enableJetifier=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

android.overridePathCheck=true

# R8 is controlled by minifyEnabled in build.gradle, no need to set here

# Disable unnecessary lint checks during build
# 注：原先这里还有一行 `android.lint.enable=false`，该属性在 AGP 8.x 已废弃并被忽略
# （生效的是 app/build.gradle 里的 `lint { checkReleaseBuilds false }`），已删除（审计 M13-e）。
android.lint.checkReleaseBuilds=false

# Enable Kotlin incremental compilation with advanced optimizations
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.incremental.enableJsIrCompilation=true

# Enable Kotlin daemon for faster compilation
kotlin.daemon.enabled=true
kotlin.compiler.execution.strategy=daemon
# Kotlin 编译守护进程是**独立**的 JVM，堆会和上面的 gradle daemon 叠加。
# 两个 8 G 就是 2026-11-10 那次 OOM 的直接原因，这里跟 Gradle 侧一起降到 2 G。
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseG1GC

# Enable KSP incremental processing
ksp.incremental=true
ksp.useClasspathSnapshot=true

# Enable faster annotation processing
android.experimental.enableNewResourceShrinker=true

# 并行度别写死成「大机器核数」：2 核机器上 8 个 worker 只会互相抢核、抬高内存峰值。
# 4 在 8 核开发机上是够用的；想跑满大机器请在本机用户级 gradle.properties 覆盖。
org.gradle.workers.max=4

# Enable file system watching for faster incremental builds
org.gradle.vfs.watch=true

# Enable daemon persistence across builds
org.gradle.daemon.idletimeout=120000

# Enable build scan plugin repository
org.gradle.plugin.repositories.lenient=true

# Enable precompiled script plugins cache
org.gradle.precompiledscript.plugins.cache=true

# 代理配置 - 所有依赖通过代理下载
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=2080
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=2080
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
