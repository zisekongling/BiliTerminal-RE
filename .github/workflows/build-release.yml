name: 构建发行版并创建 Release

# 触发方式：
# 1) 手工触发（workflow_dispatch）：填 tag 就会建 Release 并上传 APK；不填则只构建并上传 artifact。
#    **勾选 `build_only` 是「只出包不发版」的显式入口**：照常构建签名 APK 并上传 artifact，
#    但跳过「计算发行 tag 与发布说明」「创建 GitHub Release」「Notify relay」等全部发行动作——
#    适合「只想拿一个正式签名的包去传应用商店 / 自己装」，不会污染 Releases 列表、不会同步 Gitee。
#    （tag 留空也能只构建，但那条路仍会跑发布说明组装、且更新日志抽不到时会红；build_only 直接跳过。）
# 2) 推送 tag 自动触发：用该 tag 创建 Release 并上传 APK。
#    **只认版本 tag**：`YY.MM.DD[.N][-后缀]`（见下方 on.push.tags 与 verify-version job）。
#    历史上这里是 `tags: '*'`：任意 tag 都会走签名发版，而且没有任何 tag↔版本号校验，
#    曾发出过 tag 28.08.16、包内 versionName 却是 26.08.14 的错版
#    （findings/standards.md P1-1）。现在 verify-version 会在编译前硬校验：
#    tag 的日期 == build.gradle versionName、versionCode/10 == YYMMDD、
#    strings.xml 含「【YY.MM.DD 本次更新】」锚点，任一不满足直接 fail。
#
# 两种方式产出的 Release 说明都含**完整更新日志**：手工触发用输入的 release_body，
# 推 tag（inputs.* 恒空）则由 .github/scripts/extract_update_log.py 从 strings.xml 的
# update_log_current 自动抽取；抽不到就发版失败。详见 AGENTS.md 与发版技能 §4。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发行 tag（留空则仅构建，不建 Release）'
        required: false
      release_name:
        description: 'Release 名称（留空用 tag）'
        required: false
      release_body:
        description: 'Release 发布说明，支持 Markdown（留空则自动生成 commits 摘要，也是 Markdown）'
        required: false
      force_update:
        type: boolean
        description: '是否强制更新（写进 Release 说明的机器可读元数据，App 读到后不允许跳过）'
        default: false
      emit_config_json:
        type: boolean
        description: '是否额外产出给老客户端的一次性 config.json（downloadUrl=Gitee 直链）。仅渠道迁移那一次需要'
        default: false
      build_only:
        type: boolean
        description: '仅构建签名 APK 并上传 artifact：不建 Release、不发通知、不同步 Gitee（用于取包传商店/自装）'
        default: false
  push:
    tags:
      # 只接受"版本 tag"，不再对任意 tag 生效。现存 18 个 tag 的命名惯例实测只有三种
      # （无 v 前缀，也没有别的写法），下面按字符位精确匹配，而不是用 `[0-9]*` 兜底：
      #   YY.MM.DD      普通发版：26.10.24 / 26.10.19 / …… / 26.08.17 / 28.08.16
      #   YY.MM.DD.N    同日重发：26.10.10.1 / 26.10.03.1 / 26.10.03.2
      #   YY.MM.DD-后缀 带含义后缀：26.09.07-security
      # 真正的版本一致性不靠 glob 保证（glob 只能挡住 v1/test 之类误触），
      # 由 verify-version job 解析 tag 后与 app/build.gradle、strings.xml 比对。
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*'
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9]-*'

# 需要创建 Git tag / Release，授予 contents 写权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===== 前置门禁：tag 名 ↔ 版本号 / 更新日志锚点一致性（findings/standards.md P1-1） =====
  # 历史事故：tag 28.08.16 指向的 commit 里 versionName 仍是 26.08.14、versionCode 2608140，
  # Release 名与安装包版本完全对不上；26.08.17 / 26.08.27 两个 tag 还指向纯文档提交。
  # 所以这里在**编译、签名、建 Release 之前**做硬校验，不合格直接 fail（不浪费构建时间）。
  #
  # 仓库 tag 惯例（现存 18 个 tag 实测）：
  #   26.10.24                               普通发版（YY.MM.DD）
  #   26.10.10.1 / 26.10.03.1 / 26.10.03.2   同日重发（YY.MM.DD.N）
  #   26.09.07-security                      带含义后缀（YY.MM.DD-后缀）
  # 校验项：
  #   1) tag 匹配 ^YY.MM.DD([.N])?(-后缀)?$（glob 已挡一层，这里再严格解析）；
  #   2) app/build.gradle 的 versionName == YY.MM.DD（末尾 -BETA<n> 不算差异）；
  #   3) versionCode 前 6 位 == YYMMDD，**尾号 == tag 的 .N 后缀**（无后缀即 0）。这条是
  #      26.11.07.1 事故的补丁：那一版只改了 tag 没升 versionCode，装过同日首包的用户
  #      因为 UpdateManager 用严格大于比较，永远收不到修正包。
  #      （26.10.03.1 / 26.10.03.2 / 26.11.06.1 三个历史 tag 实测都符合「尾号 == N」）；
  #   4) strings.xml 含更新日志锚点「【YY.MM.DD 本次更新】」。
  # 手工 build_only（tag 留空）不校验——那条路本来就不发版。
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      checkout_ref: ${{ steps.target.outputs.checkout_ref }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - name: 解析目标 tag 与检出 ref
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          FALLBACK_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # inputs.tag 是用户输入，去掉空白避免带进 ref（tag 本身不允许空格）
          input_tag="$(printf '%s' "${INPUT_TAG:-}" | tr -d '[:space:]')"
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            checkout_ref="$FALLBACK_REF"        # refs/tags/<tag>
          else
            tag="$input_tag"
            if [ -n "$tag" ]; then
              checkout_ref="refs/tags/$tag"     # 手工触发时按 tag 自己的提交比对
            else
              checkout_ref="$FALLBACK_REF"      # 手工 build_only：仍按默认分支检出
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "目标 tag=「${tag:-<空>}」，检出 ref = $checkout_ref"

      # 按 tag 的提交检出：手工触发也必须拿 tag 自己的 build.gradle/strings.xml 来比对，
      # 否则"发旧 tag、main 已升版"会被误判。build-and-release 也用同一个 ref 构建，
      # 保证"tag 名 ↔ 被发布的包"始终指向同一个提交。
      - name: 检出代码（优先按 tag）
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          fetch-depth: 1

      - name: 校验 tag ↔ versionName / versionCode / 更新日志锚点
        id: check
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "未指定 tag（手工 build_only 构建），跳过 tag↔版本号校验"
            exit 0
          fi

          # 1) tag 形态：YY.MM.DD[.N][-后缀]
          re='^([0-9]{2})\.([0-9]{2})\.([0-9]{2})(\.[0-9]+)?(-[A-Za-z0-9._-]+)?$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::tag「$TAG」不符合仓库惯例 YY.MM.DD[.N][-后缀]（如 26.10.24、26.10.10.1、26.09.07-security）"
            exit 1
          fi
          yy="${BASH_REMATCH[1]}"
          mm="${BASH_REMATCH[2]}"
          dd="${BASH_REMATCH[3]}"
          expect_name="$yy.$mm.$dd"
          expect_code_prefix=$((10#$yy * 10000 + 10#$mm * 100 + 10#$dd))
          # 同日重发的第 N 次（tag 形如 YY.MM.DD.N）；无后缀就是当天首包
          suffix="${BASH_REMATCH[4]:-}"

          # 2) build.gradle 实际值
          gradle=app/build.gradle
          actual_name=$(grep -oP 'versionName\s+"\K[^"]+' "$gradle" | head -1 || true)
          actual_code=$(grep -oP '^[[:space:]]*versionCode[[:space:]]+\K[0-9]+' "$gradle" | head -1 || true)
          if [ -z "$actual_name" ] || [ -z "$actual_code" ]; then
            echo "::error::无法从 $gradle 读出 versionName/versionCode"
            exit 1
          fi
          base_name="${actual_name%%-*}"   # 去掉可能的 -BETA<n>（betaVer != 0 时才会加）

          fail=0
          if [ "$base_name" != "$expect_name" ]; then
            echo "::error::tag「$TAG」期望 versionName=「$expect_name」，实际 build.gradle=「$actual_name」"
            fail=1
          fi
          if ! [[ "$actual_code" =~ ^[0-9]{7}$ ]]; then
            echo "::error::versionCode=$actual_code 不是 7 位 YYMMDDx 形式"
            fail=1
          elif [ $((10#$actual_code / 10)) -ne "$expect_code_prefix" ]; then
            echo "::error::tag「$TAG」期望 versionCode 前缀 $expect_code_prefix（YYMMDD），实际 $actual_code/10 = $((10#$actual_code / 10))"
            fail=1
          else
            # 同日重发的尾号必须跟着 tag 走：装了同日首包的用户靠它才能收到修正包
            # （UpdateManager 对 versionCode 用严格大于比较，尾号不变等于这一版发不出去）。
            expect_tail=0
            if [ -n "$suffix" ]; then expect_tail=$((10#${suffix#.})); fi
            actual_tail=$((10#$actual_code % 10))
            if [ "$actual_tail" -ne "$expect_tail" ]; then
              echo "::error::tag「$TAG」期望 versionCode 尾号 $expect_tail（YY.MM.DD.N 的第 N 次重发），实际 $actual_code 的尾号是 $actual_tail；同日重发必须升尾号，否则装过同日首包的用户收不到更新"
              fail=1
            fi
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::tag 与安装包版本不一致，拒绝构建/发版（见 findings/standards.md P1-1）"
            exit 1
          fi

          # 3) 更新日志锚点（关于页「本次更新」标题必须跟着版本号走）
          anchor="【${expect_name} 本次更新】"
          if ! grep -qF "$anchor" app/src/main/res/values/strings.xml; then
            echo "::error::strings.xml 缺少更新日志锚点「$anchor」（update_log_current 首项），拒绝发版"
            exit 1
          fi

          echo "version_name=$actual_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$actual_code" >> "$GITHUB_OUTPUT"
          echo "✅ tag $TAG ↔ versionName $actual_name / versionCode $actual_code 一致，更新日志锚点存在"

  build-and-release:
    # 版本一致性不通过就不编译、不签名、不发版
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 归一化「仅构建」开关：**只有手工触发且勾选 build_only 才是 true**。
    # 推 tag 时 inputs.* 恒为空（同 published 说明里那条坑），所以这里必须显式判 event_name，
    # 否则 `${inputs.build_only}` 在 push 下算成空串、下游的 if 判断会依赖隐式真值转换。
    # 下游一律用 `env.BUILD_ONLY != 'true'` 比较**字符串**，不比较布尔（YAML/表达式里 boolean
    # 与 'true' 混用是最容易出错的一处）。
    env:
      BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 用 verify-version 解析出的 ref 构建：推 tag 时是 refs/tags/<tag>（与旧行为一致），
          # 手工触发填了 tag 时也构建 tag 自己的提交——避免"main 已升版、却拿旧 tag 发版"
          # 造成的版本错位（P1-1 的另一半）。
          ref: ${{ needs.verify-version.outputs.checkout_ref }}

      # ── 可选私有功能源码注入 ────────────────────────────────────────────────
      # 扫码 / 视频二维码这类功能**不在本仓库**：源码在私有仓库，构建时才检出到根目录 private/
      # （private/ 已 gitignore）。app/build.gradle 检测到 private/src/main/java 才把
      # java/res/manifest/R8 规则挂进构建；目录不存在就是公开版，行为与从前完全一致。
      #
      #   Secrets.PRIVATE_FEATURE_REPO  —— 私有仓库 owner/repo
      #   Secrets.PRIVATE_FEATURE_TOKEN —— 只读该私有仓库的 PAT（fine-grained，Contents: Read）
      #
      # 没配这两个 Secret 也能正常发版（发的是公开版）；PR 构建永远拿不到 Secrets，
      # 必然是公开版。机制说明见 docs/optional-features.md。
      - name: 注入可选私有功能源码（未配置则跳过）
        id: private_src
        env:
          PRIVATE_FEATURE_REPO: ${{ secrets.PRIVATE_FEATURE_REPO }}
          PRIVATE_FEATURE_TOKEN: ${{ secrets.PRIVATE_FEATURE_TOKEN }}
        run: |
          # 注入结果要交给「校验私有功能凭证」用：注入了私有源码却缺凭证，等于发一个半残的包，
          # 那一步会直接 fail 而不是只打 notice（见 findings/standards.md）。
          echo "injected=false" >> "$GITHUB_OUTPUT"
          if [ -z "$PRIVATE_FEATURE_REPO" ] || [ -z "$PRIVATE_FEATURE_TOKEN" ]; then
            echo "::notice::未配置 Secrets.PRIVATE_FEATURE_REPO / PRIVATE_FEATURE_TOKEN，按公开版构建（不含私有功能）"
            exit 0
          fi
          rm -rf private
          git clone --depth 1 \
            "https://x-access-token:${PRIVATE_FEATURE_TOKEN}@github.com/${PRIVATE_FEATURE_REPO}.git" private
          # token 不能留在 .git/config 里（下一步会打包 workspace，artifact 里不该有凭据）
          rm -rf private/.git
          if [ ! -d private/src/main/java ]; then
            echo "::error::私有仓库里没有 src/main/java，private/ 结构不对"
            exit 1
          fi
          echo "injected=true" >> "$GITHUB_OUTPUT"
          echo "私有功能源码已注入："
          find private -maxdepth 2 -type d | sort

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 与 ci.yml 同一处坑：默认 packages 里的旧 "tools" 包已下架，
          # sdkmanager 会 `Warning: Failed to find package 'tools'` + exit 1 打死 job。
          packages: 'platform-tools'

      - name: 赋予 gradlew 可执行权限
        run: chmod +x gradlew

      # gradle.properties 硬编码了本机 Windows JDK 路径和本地代理（Clash），
      # Linux CI 必须移除，否则会拿不存在的 JDK 路径启动 daemon、并通过本地代理拉依赖失败。
      # 同时把 Gradle/Kotlin daemon 堆内存调低，避免在 GitHub 较小内存的 runner 上 OOM。
      - name: 适配 Linux 构建环境
        run: |
          # 与 ci.yml 同一处修正：注释形式的代理行也要删，守卫只看生效行。
          sed -i -E '/^[[:space:]]*#?[[:space:]]*org\.gradle\.java\.home=/d' gradle.properties
          sed -i -E '/^[[:space:]]*#?[[:space:]]*systemProp\.(http|https)\.(proxyHost|proxyPort)=/d' gradle.properties
          # 堆内存必须整行替换（与 ci.yml 同一处修正，调研清单第 3 条）：原先写死 `-Xmx4096m`，
          # 本仓库实际是 `-Xmx8192m`，替换 0 命中、后面又挂了 `|| true`，「防 runner OOM」从未生效。
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx2048m -Xms1024m -Dfile.encoding=UTF-8/' gradle.properties
          sed -i -E 's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2048m/' gradle.properties
          if ! grep -qE '^org\.gradle\.jvmargs=-Xmx2048m' gradle.properties; then
            echo "::error::org.gradle.jvmargs 未被替换成 -Xmx2048m，Gradle daemon 堆内存设置没生效"
            exit 1
          fi
          echo "CI 实际生效的 JVM 参数："
          grep -nE '^(org\.gradle\.jvmargs|kotlin\.daemon\.jvmargs)=' gradle.properties
          if grep -nE '^[[:space:]]*(org\.gradle\.java\.home|systemProp\.(http|https)\.(proxyHost|proxyPort))=' gradle.properties; then
            echo "::error::gradle.properties 仍残留生效中的本机配置，请检查"
            exit 1
          fi
          echo "gradle.properties 已清理"

      # 用仓库 Secrets 生成签名配置：
      #   KEYSTORE_BASE64 —— key.jks 的 base64 编码
      #   KEY_PASSWORD / ALIAS_NAME / ALIAS_PASSWORD —— 签名口令与别名
      # app/build.gradle 的 release 签名从根目录 local.properties 读取（已 gitignore），这里按同格式写入。
      - name: 校验签名 Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEY_PASSWORD ALIAS_NAME ALIAS_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少仓库 Secrets.$v，请在仓库 Settings -> Secrets and variables -> Actions 配置"
              exit 1
            fi
          done
          echo "签名 Secrets 校验通过"

      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > key.jks
          {
            echo "KEY_PATH=$GITHUB_WORKSPACE/key.jks"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "ALIAS_NAME=$ALIAS_NAME"
            echo "ALIAS_PASSWORD=$ALIAS_PASSWORD"
          } > local.properties
          ls -l key.jks
          echo "--- local.properties ---"
          sed -E 's/(KEY_PASSWORD|ALIAS_PASSWORD)=.*/\1=***/' local.properties

      # 发版前先跑单测：此前 112 个用例不在任何自动化路径执行，测试全红也能发出 Release
      # （见 docs/review/upstream-fork-audit.md §五 E3）。红着测试就不该发版。
      # 引入 product flavor（standard / coexist）后，单测任务名带上了 flavor：
      # testDebugUnitTest 已不存在，必须写 testStandardDebugUnitTest
      # （两个 flavor 共用同一份 app/src/test，跑一个即可）。
      - name: 运行单元测试
        run: ./gradlew :app:testStandardDebugUnitTest --stacktrace

      # ── 私有功能的第三方凭证（BGM 数据代理 / 第三方弹幕）──────────────────────
      # 和 Kazumi 一样**只在构建期注入**：值只经 Secrets → 环境变量 → app/build.gradle →
      # BuildConfig，仓库里不出现明文。公开版缺凭证是正常的（直接打 notice 继续）；
      # 但注入了私有源码还缺凭证就是半残的包，这一步会 fail。
      - name: 校验私有功能凭证（注入私有源码后缺凭证即 fail）
        env:
          KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
          KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        run: |
          # 公开版（没注入私有源码）缺凭证是正常的：这两个值只被私有侧消费，公开版根本用不到。
          # 但**注入了私有源码还缺凭证**就是发一个半残的包，必须 fail —— 从前只打 notice，
          # 于是「私有功能在、功能却全套降级」的包被静默发出去过一次。
          injected="${{ steps.private_src.outputs.injected }}"
          missing=""
          if [ -z "$KAZUMI_APPID" ] || [ -z "$KAZUMI_KEY" ]; then
            missing="$missing KAZUMI_APPID/KAZUMI_KEY"
          else
            echo "BGM 数据代理凭证已就绪（不打印值）"
          fi
          if [ -z "$DANDANAPI_APPID" ] || [ -z "$DANDANAPI_KEY" ]; then
            missing="$missing DANDANAPI_APPID/DANDANAPI_KEY"
          else
            echo "第三方弹幕凭证已就绪（不打印值）"
          fi
          if [ -z "$missing" ]; then
            exit 0
          fi
          if [ "$injected" = "true" ]; then
            echo "::error::已注入私有功能源码，但缺少 Secrets:$missing —— 这样发出去的包私有功能会整套降级，拒绝发版"
            exit 1
          fi
          echo "::notice::公开版构建，缺少 Secrets:$missing（私有功能不在这次构建里，无需凭证）"

      - name: 构建签名发行 APK
        env:
          KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
          KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        run: ./gradlew :app:assembleRelease

      # 崩溃堆栈解混淆（R8 retrace）需要「这一版、这个 flavor、这个构建变体」的 mapping。
      # 注意：mapping 里含私有功能的类名/方法名，**绝不能**作为公开仓库的 artifact 上传，
      # 只 scp 到 HK 的固定目录（600）。没配 Secret 就跳过并打印 notice，不影响发版。
      #   Secrets.HK_SSH_KEY      —— 必填，能登录 HK 的私钥（建议单独一把、只允许写该目录）
      #   Secrets.HK_HOST         —— 可选，默认 154.222.27.216
      #   Secrets.HK_USER         —— 可选，默认 root
      #   Secrets.HK_MAPPING_DIR  —— 可选，默认 /opt/rebiliterminal-api/mappings
      - name: 上传 R8 mapping 到 HK（未配置则跳过）
        shell: bash
        env:
          HK_SSH_KEY: ${{ secrets.HK_SSH_KEY }}
          HK_HOST: ${{ secrets.HK_HOST }}
          HK_USER: ${{ secrets.HK_USER }}
          HK_MAPPING_DIR: ${{ secrets.HK_MAPPING_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${HK_SSH_KEY:-}" ]; then
            echo "::notice::未配置 Secrets.HK_SSH_KEY，跳过 mapping 上传（控制台将无法解混淆这一版的崩溃）"
            exit 0
          fi
          host="${HK_HOST:-154.222.27.216}"
          user="${HK_USER:-root}"
          remote_dir="${HK_MAPPING_DIR:-/opt/rebiliterminal-api/mappings}"
          version_code=$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]' app/build.gradle | awk '{print $2}')
          if [ -z "$version_code" ]; then
            echo "::error::读不到 app/build.gradle 的 versionCode"
            exit 1
          fi
          variant=public
          if [ -d private/src/main/java ]; then variant=private; fi
          keyfile=$(mktemp)
          chmod 600 "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$HK_SSH_KEY" > "$keyfile"
          opts=(-i "$keyfile" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          for flavor in standard coexist; do
            src="app/build/outputs/mapping/${flavor}Release/mapping.txt"
            # mapping 是构建产物；missing 说明 R8 配置被改了（minify 没开），必须红掉
            if [ ! -f "$src" ]; then
              echo "::error::缺少 $src（release 构建没有生成 mapping，检查 minifyEnabled）"
              exit 1
            fi
            dest="${user}@${host}:${remote_dir}/${version_code}_${flavor}_${variant}_mapping.txt"
            scp "${opts[@]}" "$src" "$dest"
            echo "已上传 $flavor（variant=$variant）"
          done
          # scp 默认按 umask 建文件，这里显式收紧到 600（mapping 含私有实现细节）
          ssh "${opts[@]}" "${user}@${host}" \
            "chmod 600 '${remote_dir}/${version_code}_'*'_mapping.txt' 2>/dev/null || true"
          echo "mapping 上传完成：version_code=$version_code variant=$variant"

      # flavor 上线后 AGP 把产物放在 outputs/apk/<flavor>/release/ 下，且普通版被自动
      # 命名成 app-standard-<abi>-release.apk。这里统一搬进 outputs/apk/release/ 并
      # 把普通版改回**历史文件名 app-<abi>-release.apk** —— 老客户端的更新检查是按
      # 精确文件名匹配的（util/UpdateRelease.kt），一改名它们就永远收不到更新。
      # 共存版保留 app-coexist-<abi>-release.apk，共存版客户端只认这个名字。
      - name: 整理发行 APK（普通版保持历史文件名）
        shell: bash
        run: |
          set -euo pipefail
          dest=app/build/outputs/apk/release
          rm -rf "$dest"
          mkdir -p "$dest"
          for f in app/build/outputs/apk/standard/release/app-standard-*.apk; do
            [ -f "$f" ] || { echo "::error::没找到普通版 release APK"; exit 1; }
            n=$(basename "$f")
            cp "$f" "$dest/${n/app-standard-/app-}"
          done
          for f in app/build/outputs/apk/coexist/release/app-coexist-*.apk; do
            [ -f "$f" ] || { echo "::error::没找到共存版 release APK"; exit 1; }
            cp "$f" "$dest/"
          done
          echo "--- 发行目录 ---"
          ls -l "$dest"

      # 发布说明与 Release 附件里都附上每个 APK 的 MD5，方便用户核对下载完整性 / 确认包没被换过。
      # 上游也只在部分版本提供过 MD5 表（见 docs/review/upstream-fork-audit.md §五 E1）。
      - name: 生成 APK 校验值（MD5）
        id: md5
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/build/outputs/apk/release/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有找到任何 release APK"
            exit 1
          fi
          out_dir=app/build/outputs/apk/release
          : > "$out_dir/md5sums.txt"
          sums=""
          for f in "${files[@]}"; do
            sum=$(md5sum "$f" | cut -d' ' -f1)
            size=$(stat -c%s "$f")
            name=$(basename "$f")
            # md5sums.txt 用标准的 `sum  filename` 两列格式，用户在 APK 同目录下
            # 直接 `md5sum -c md5sums.txt` 就能校验；尺寸只在发布说明里展示。
            printf '%s  %s\n' "$sum" "$name" >> "$out_dir/md5sums.txt"
            echo "$name = $sum ($size bytes)"
            sums="${sums}${sum}  ${name}  (${size} 字节)"$'\n'
          done
          echo "--- md5sums.txt ---"
          cat "$out_dir/md5sums.txt"
          {
            echo "sums<<MD5_EOF"
            printf '%s' "$sums"
            echo "MD5_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 上传 APK 到 artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/
          if-no-files-found: error

      # 计算目标 tag 与发布说明：tag 推送用 pushed ref；手工触发用输入的 tag；为空则跳过 Release。
      # inputs 一律经 env 传入，不直接插进 shell 脚本。
      # build_only 下整步跳过：不组装发布说明，也就不需要更新日志能抽得出来——
      # 「只出包」不该因为 strings.xml 还没写当版日志而红掉。
      - name: 计算发行 tag 与发布说明
        id: tag
        if: env.BUILD_ONLY != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NAME: ${{ inputs.release_name }}
          INPUT_BODY: ${{ inputs.release_body }}
          FORCE_UPDATE: ${{ inputs.force_update }}
          MD5_SUMS: ${{ steps.md5.outputs.sums }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Release 名称：手工触发可用 release_name 覆盖，否则用 tag。
          # 在 shell 里算好再输出，避免在 action 表达式里写 `inputs.x || steps.y`。
          if [ -n "$INPUT_NAME" ]; then
            echo "name=$INPUT_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          fi

          # APK 校验值区块。Release 附件里另有一份标准格式的 md5sums.txt，两条路都留着，
          # 避免 GitHub 在 generate_release_notes 模式下改写 body 时把它弄丢。
          # 注意 $MD5_SUMS 来自 $GITHUB_OUTPUT，末尾不带换行，这里必须自己补一个，
          # 否则收尾的 ``` 会粘到最后一行校验值后面。
          md5_section=$(printf '### APK 校验值（MD5）\n\n```\n%s\n```\n' "$MD5_SUMS")

          # ---- 本次更新说明 ----
          # 手工触发时用输入的 release_body；**推 tag 时 inputs.* 恒为空**，改为从
          # strings.xml 的 update_log_current 自动抽（`.github/scripts/extract_update_log.py`）。
          # 两条路都必须给出完整更新日志：只留 MD5 表 + 机器元数据不算合格的发布说明，
          # 拿 GitHub 自动生成的 commits 摘要顶替也不算（见 AGENTS.md 与发版技能 §4 的硬要求）。
          # 抽不到就**直接失败**——宁可让发版红掉，也不要发出一个没有更新说明的 Release。
          log_body="$INPUT_BODY"
          if [ -z "$log_body" ]; then
            # 用 `if !` 包住，避免 `set -e` 在命令替换失败时直接中断、来不及打印原因
            if ! log_body=$(python3 .github/scripts/extract_update_log.py app/src/main/res/values/strings.xml); then
              echo "::error::推 tag 时自动抽取更新日志失败（见上面的 ::error::），拒绝发出没有更新说明的 Release"
              exit 1
            fi
            if [ -z "$log_body" ]; then
              echo "::error::strings.xml 的 update_log_current 抽出来是空的，拒绝发出没有更新说明的 Release"
              exit 1
            fi
            echo "已从 strings.xml 自动抽取本次更新日志：$(printf '%s\n' "$log_body" | wc -l) 条"
          fi

          final_body=$(printf '%s\n\n%s' "$log_body" "$md5_section")

          # ---- 机器可读元数据 ----
          # App 的更新检查（UpdateManager）从 Release 说明里读这一段拿 versionCode / versionName /
          # forceUpdate；读不到时才退回"按 tag 推算"。用 HTML 注释包起来，
          # GitHub 与 Gitee 渲染 Markdown 时都不会显示，也不会打断正文排版。
          # 版本号取 app/build.gradle 的**实际构建值**（而不是 tag），这样即使 tag 写法不规范，
          # 客户端比较的版本号也一定与被发布的那个包一致。
          version_name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          version_code=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          if [ -z "$version_code" ] || [ -z "$version_name" ]; then
            echo "::error::无法从 app/build.gradle 读出 versionName/versionCode"
            exit 1
          fi
          force_update="false"
          case "$(printf '%s' "${FORCE_UPDATE:-}" | tr '[:upper:]' '[:lower:]')" in
            true|1|yes) force_update="true" ;;
          esac
          meta="<!-- update: versionCode=${version_code} versionName=${version_name} forceUpdate=${force_update} -->"
          final_body=$(printf '%s\n\n%s' "$final_body" "$meta")

          # 发布说明落盘给「生成 config.json」的脚本按文件读，避免把多行 body 塞进命令行/环境变量
          printf '%s\n' "$final_body" > "$RUNNER_TEMP/release-body.md"
          echo "body_file=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

          # 单独给出 has_body 供下游判断，不再用 "inputs.release_body == ''" 表达分支
          # —— push 事件下 inputs.* 恒为空，那种写法只是碰巧算出期望结果。
          # 现在 log_body 要么来自输入、要么来自 strings.xml，所以实际上恒为 true：
          # GitHub 不再自动补 commits 摘要，发布说明就是完整的更新日志 + MD5 表 + 元数据。
          if [ -n "$log_body" ]; then
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "body<<RELEASE_BODY_EOF"
            printf '%s\n' "$final_body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "DEBUG event=$EVENT_NAME tag=$tag version=$version_name($version_code) force=$force_update has_body=$(grep '^has_body=' "$GITHUB_OUTPUT" | cut -d= -f2-)"

      # 注意：Gitee 同步**已交给中转服务**（见文件末尾的 Notify relay 步骤）。
      # Action 到 Gitee 网络不通，这里不再有任何直连 Gitee 的步骤（不 git push、不调 Gitee API）。


      # 发行版直链清单。两个源的 URL 都是可预测的（{源}/releases/download/{tag}/{文件名}），
      # 所以**不必等 Gitee 同步完成**（中转是异步的），两份都列出来：GitHub 立即可用，Gitee 稍后可用。
      - name: 生成发行版直链清单
        if: env.BUILD_ONLY != 'true' && steps.tag.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          out=app/build/outputs/apk/release/release-links.txt
          {
            echo "# ${NAME} 发行版直链"
            echo
            echo "tag：${TAG}"
            echo
            echo "## Gitee（由中转服务异步同步，发布后稍等片刻）"
            echo
            for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/md5sums.txt; do
              [ -f "$f" ] || continue
              n=$(basename "$f")
              echo "- ${n}"
              echo "  https://gitee.com/zisekongling/bili-terminal-re/releases/download/${TAG}/${n}"
            done
            echo
            echo "## GitHub（立即可用，客户端兜底源）"
            echo
            for f in app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/md5sums.txt; do
              [ -f "$f" ] || continue
              n=$(basename "$f")
              echo "- ${n}"
              echo "  https://github.com/zisekongling/BiliTerminal-RE/releases/download/${TAG}/${n}"
            done
          } > "$out"
          cat "$out"

      # 给**老客户端**的一次性 config.json（渠道迁移用）：
      # 26.10.02 及更早的客户端只认 123pan 上那份 config.json，不认识"读发行版"的新机制。
      # 这里按老格式产出一份，downloadUrl 指向 **Gitee 的 32 位包**（老客户端多装在 32 位手表上，
      # 且 arm64 设备通常也能装 32 位包）。Gitee 上的附件由中转服务在发版后异步补齐 ——
      # 这份 config.json 还需要人工传到 123pan，等那时中转早已完成。
      # 若想改成 GitHub 直链（更"立即可用"），只需把下面的 base 换成 github.com 那行。
      # 注意：CI 不部署它 —— 需人工把这份文件传到 123pan 的更新配置位置。
      - name: 生成给老客户端的一次性 config.json
        if: env.BUILD_ONLY != 'true' && steps.tag.outputs.tag != '' && inputs.emit_config_json
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION_CODE: ${{ steps.tag.outputs.version_code }}
          VERSION_NAME: ${{ steps.tag.outputs.version_name }}
          DESCRIPTION_FILE: ${{ steps.tag.outputs.body_file }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          out=app/build/outputs/apk/release/config.json
          base="https://gitee.com/zisekongling/bili-terminal-re/releases/download/${TAG}"
          # 迁移用包固定给 32 位（armeabi-v7a）
          export DOWNLOAD_URL="${base}/app-armeabi-v7a-release.apk"
          export OUT="$out"
          python3 .github/scripts/make_config_json.py

      - name: 创建 GitHub Release
        if: env.BUILD_ONLY != 'true' && steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          # 版本说明支持 Markdown：release_body 或从 strings.xml 抽出的更新日志在前，
          # MD5 校验值表在后，末尾附 `<!-- update: ... -->` 机器可读元数据（给客户端更新检查读）。
          # has_body 现在实际恒为 true，所以不再让 GitHub 自动补 commits 摘要——
          # 发布说明以「完整更新日志」为准，commits 摘要不是替代品。
          body: ${{ steps.tag.outputs.body }}
          generate_release_notes: ${{ steps.tag.outputs.has_body != 'true' }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/md5sums.txt
            app/build/outputs/apk/release/release-links.txt
            app/build/outputs/apk/release/config.json
          target_commitish: main
          draft: false
          prerelease: false

      # 通知中转服务，由它把本次 Release 的附件同步到 Gitee；
      # Action 侧不再直接访问 Gitee（网络不通）。
      # ⚠️ 必须排在「创建 GitHub Release（含全部附件）」之后：中转会自己去 GitHub 下载附件，
      #    早了会拿到不完整/不存在的附件。签名与请求体必须是**同一份字节**，
      #    所以请求体用 printf 落盘再 --data-binary 发送（echo 会多一个换行导致 401）。
      - name: Notify relay (GitHub -> Gitee 中转)
        if: success() && env.BUILD_ONLY != 'true' && steps.tag.outputs.tag != ''
        shell: bash
        env:
          # 中转地址与共享密钥都走仓库 Secret，不写进代码库（提示里也不要回显）
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          TAG: ${{ steps.tag.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "::add-mask::$RELAY_URL"
          echo "::add-mask::$RELAY_SECRET"
          # 换主后中转服务暂停使用（Secrets.RELAY_URL / RELAY_SECRET 未配置）：
          # 缺这两个值只该少一段 Gitee 同步，不该让整个发版失败 —— 告警后跳过。
          if [ -z "${RELAY_URL:-}" ] || [ -z "${RELAY_SECRET:-}" ]; then
            echo "::warning::未配置 Secrets.RELAY_URL / Secrets.RELAY_SECRET，跳过 Gitee 中转同步"
            exit 0
          fi
          BODY=$(printf '{"repository":{"full_name":"zisekongling/BiliTerminal-RE"},"release":{"tag_name":"%s"}}' "$TAG")
          printf '%s' "$BODY" > /tmp/relay.json
          SIG=$(openssl dgst -sha256 -hmac "$RELAY_SECRET" -binary /tmp/relay.json | xxd -p -c256)
          for i in 1 2 3; do
            code=$(curl -sS --fail-with-body -o /tmp/relay.out -w '%{http_code}' --max-time 30 \
              -X POST "$RELAY_URL" \
              -H 'Content-Type: application/json' \
              -H 'X-GitHub-Event: repository_dispatch' \
              -H "X-Hub-Signature-256: sha256=$SIG" \
              --data-binary @/tmp/relay.json) && { echo "通知成功 HTTP $code: $(cat /tmp/relay.out)"; break; }
            echo "第 $i 次通知失败 (HTTP ${code:-?})，5 秒后重试"; [ "$i" = 3 ] && exit 1; sleep 5
          done
