<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=320, height=320, user-scalable=no, maximum-scale=1.0">
    <title>紧凑大图标手表播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background: #1a1a1a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
        }

        .watch-player {
            width: 320px; height: 320px; background: #000000; border-radius: 32px;
            position: relative; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.9);
            color: #fff; display: flex; flex-direction: column;
        }

        .slider-wrapper {
            display: flex; width: 200%; height: 100%;
            transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1); transform: translateX(0%); 
        }

        .page {
            width: 50%; height: 100%; 
            /* 【调整】顶部 padding 给多点空间让文字展开，底部继续压缩 */
            padding: 10px 12px 6px 12px; 
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* ====== 播放器页面 ====== */
        .track-title {
            /* 【调整】字号大幅加大到 18px */
            font-size: 18px; font-weight: 600; letter-spacing: 0.5px; 
            margin-bottom: 4px; /* 增加行间距 */
            display: flex; justify-content: space-between; align-items: center;
            /* 添加防溢出省略号，防止歌名过长顶破布局 */
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 100%;
        }
        .track-title i { font-size: 16px; color: #aaa; } 
        
        /* 【调整】歌手字号加大到 14px */
        .track-artist { font-size: 14px; color: #7a7a7a; font-weight: 400; }

        .main-controls {
            display: flex; justify-content: space-evenly; align-items: center; padding: 2px 0;
        }
        
        .icon-btn {
            background: transparent; border: none; color: #fff; font-size: 28px; 
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.2s;
        }
        .icon-btn:active { opacity: 0.6; }
        
        .play-btn {
            width: 78px; height: 78px; border-radius: 50%; background: #1f1f1f;
            border: none; color: #fff; font-size: 32px; display: flex; justify-content: center; 
            align-items: center; cursor: pointer; transition: 0.3s;
        }
        .play-btn:active { background: #2a2a2a; }

        .progress-area {
            position: relative; height: 20px; display: flex; align-items: center; cursor: pointer; margin: 2px 0;
        }
        .progress-track { width: 100%; height: 2px; background: #333333; border-radius: 2px; position: relative; }
        .progress-fill { height: 100%; width: 20%; background: #ef4444; border-radius: 2px; position: absolute; top: 0; left: 0; }
        .progress-thumb { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; position: absolute; top: 50%; left: 20%; transform: translate(-50%, -50%); }

        .footer-controls { display: flex; justify-content: space-evenly; align-items: center; margin-top: 2px; }

        /* ====== 歌词页面 ====== */
        .lyrics-header { font-size: 15px; font-weight: 500; color: #fff; margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .lyrics-container {
            flex-grow: 1; overflow-y: auto; font-size: 13px; line-height: 1.8; color: #888; padding-right: 4px;
        }
        .lyrics-container::-webkit-scrollbar { width: 0px; }
        .lyrics-container .highlight { color: #fff; font-weight: 400; }

        .page-indicators {
            position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; z-index: 10;
        }
        .indicator { width: 4px; height: 4px; border-radius: 50%; background: #444; transition: background 0.3s; }
        .indicator.active { background: #fff; }
    </style>
</head>
<body>

<div class="watch-player" id="watchPlayer">
    <div class="slider-wrapper" id="sliderWrapper">
        
        <!-- 第1页：播放器界面 -->
        <div class="page">
            <div class="track-info">
                <div class="track-title">
                    恋人 (你换了原创
                    <i class="fa-solid fa-bars"></i>
                </div>
                <div class="track-artist">余-AcoLasía</div>
            </div>

            <div class="main-controls">
                <button class="icon-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-btn" id="playBtn"><i class="fa-solid fa-pause" id="playIcon"></i></button>
                <button class="icon-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>

            <div class="progress-area" id="progressArea">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-thumb" id="progressThumb"></div>
            </div>

            <div class="footer-controls">
                <button class="icon-btn"><i class="fa-regular fa-heart"></i></button>
                <button class="icon-btn"><i class="fa-solid fa-volume-high"></i></button>
                <button class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </div>
        </div>

        <!-- 第2页：歌词界面 -->
        <div class="page">
            <div class="lyrics-header">
                <i class="fa-solid fa-music" style="margin-right: 6px;"></i> 歌词
            </div>
            <div class="lyrics-container">
                <div class="highlight">恋人 (你换了原创) - 余-AcoLasía</div>
                <br>
                <div>为何你换了新的原创</div>
                <div>那些旋律还在回荡</div>
                <div>却已不是 从前模样</div>
                <div class="highlight">每当夜深 独自望向月亮</div>
                <div>想起你曾为我哼唱</div>
                <div>回忆的线 那么漫长</div>
                <div>拉扯着过往</div>
                <div>如果爱还能重来一趟</div>
                <div class="highlight">(副歌高潮部分)</div>
                <div>恋人啊 你换了原创</div>
                <div>故事换了篇章</div>
                <div>可我的心底 依然滚烫</div>
                <br>
                <div style="color:#555; text-align:center; margin-top: 8px;">← 滑动返回播放器</div>
            </div>
        </div>

    </div>

    <div class="page-indicators">
        <div class="indicator active" data-index="0"></div>
        <div class="indicator" data-index="1"></div>
    </div>
</div>

<script>
    (function() {
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        let isPlaying = true;
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playIcon.className = isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        });

        const progressArea = document.getElementById('progressArea');
        const progressFill = document.getElementById('progressFill');
        const progressThumb = document.getElementById('progressThumb');
        function updateProgress(percent) {
            const clamped = Math.min(100, Math.max(0, percent));
            progressFill.style.width = clamped + '%';
            progressThumb.style.left = clamped + '%';
        }
        progressArea.addEventListener('click', (e) => {
            const rect = progressArea.getBoundingClientRect();
            const percent = ((e.clientX - rect.left) / rect.width) * 100;
            updateProgress(percent);
        });

        const sliderWrapper = document.getElementById('sliderWrapper');
        const indicators = document.querySelectorAll('.indicator');
        let startX = 0, currentIndex = 0, isDragging = false;
        const SCREEN_WIDTH = 320; 

        function goToPage(index) {
            currentIndex = index;
            sliderWrapper.style.transform = `translateX(-${index * 50}%)`;
            indicators.forEach((dot, i) => dot.classList.toggle('active', i === index));
        }

        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            sliderWrapper.style.transition = 'none'; 
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const diffX = e.touches[0].clientX - startX;
            const offsetPercentage = (diffX / SCREEN_WIDTH) * 50; 
            let transformVal = -(currentIndex * 50) + offsetPercentage;
            if(transformVal > 2) transformVal = 2; 
            if(transformVal < -52) transformVal = -52;
            sliderWrapper.style.transform = `translateX(${transformVal}%)`;
        });

        document.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            sliderWrapper.style.transition = 'transform 0.25s cubic-bezier(0.25, 0.1, 0.25, 1)';
            
            const matrix = getComputedStyle(sliderWrapper).transform;
            let currentTranslateX = 0;
            if (matrix !== 'none') {
                const values = matrix.match(/matrix.*\((.+)\)/);
                if (values) {
                    const nums = values[1].split(', ');
                    currentTranslateX = parseFloat(nums[4]);
                }
            }
            
            let targetIndex = currentIndex;
            const targetPxIndex0 = 0;
            const targetPxIndex1 = -SCREEN_WIDTH; 

            if (Math.abs(currentTranslateX - targetPxIndex0) < Math.abs(currentTranslateX - targetPxIndex1)) {
                targetIndex = 0;
            } else {
                targetIndex = 1;
            }
            goToPage(targetIndex);
        });

        goToPage(0);
    })();
</script>
</body>
</html>
